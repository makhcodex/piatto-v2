[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
# Session-scoped, so the engine fixture and the per-test session fixture share
# one event loop. Function scope raises ScopeMismatch against a session engine.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
